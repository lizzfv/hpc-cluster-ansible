---
# Inventory for the included Vagrantfile.
# Usage: ansible-playbook -i inventory/vagrant.yml site.yml
all:
  children:
    hpc_head:
      hosts:
        head01:
          ansible_host: 192.168.56.10
          ansible_ssh_private_key_file: .vagrant/machines/head01/virtualbox/private_key
    hpc_compute:
      hosts:
        node01:
          ansible_host: 192.168.56.11
          ansible_ssh_private_key_file: .vagrant/machines/node01/virtualbox/private_key
        node02:
          ansible_host: 192.168.56.12
          ansible_ssh_private_key_file: .vagrant/machines/node02/virtualbox/private_key
    hpc:
      children:
        hpc_head:
        hpc_compute:
  vars:
    ansible_user: vagrant
    ssh_hardening_password_auth: true
