---
# Inventory for three Rocky Linux VMs on a Proxmox hypervisor.
# IPs are the ones the VMs got from DHCP; fix them (static) before relying on this.
# Usage: ansible-playbook -i inventory/proxmox/hosts.yml site.yml
all:
  children:
    hpc_head:
      hosts:
        head01:
          ansible_host: 192.168.10.108
    hpc_compute:
      hosts:
        node01:
          ansible_host: 192.168.10.107
        node02:
          ansible_host: 192.168.10.106
    hpc:
      children:
        hpc_head:
        hpc_compute:
  vars:
    ansible_user: root
