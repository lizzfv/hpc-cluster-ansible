---
# Example inventory: one head node and two compute nodes.
# Replace the addresses with your own hosts (VMs, Vagrant boxes, bare metal...).
all:
  children:
    hpc_head:
      hosts:
        head01:
          ansible_host: 192.168.56.10
    hpc_compute:
      hosts:
        node01:
          ansible_host: 192.168.56.11
        node02:
          ansible_host: 192.168.56.12
    hpc:
      children:
        hpc_head:
        hpc_compute:
  vars:
    ansible_user: rocky
