---
- name: Install NFS server packages
  ansible.builtin.dnf:
    name: nfs-utils
    state: present

- name: Create exported directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nfs_server_exports }}"
  loop_control:
    label: "{{ item.path }}"

- name: Configure /etc/exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Re-export filesystems

- name: Enable and start nfs-server
  ansible.builtin.service:
    name: nfs-server
    state: started
    enabled: true

- name: Open NFS services in the firewall
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - nfs
    - mountd
    - rpc-bind
